schema_version: 1
defaults:
  seed: 0
  temperature: 0.0
fixtures:
  red_square:
    generator: raster_shapes
    width: 256
    height: 256
    background: [255, 255, 255]
    shapes:
      - type: rectangle
        bounds: [64, 64, 192, 192]
        color: [255, 0, 0]
  mlx_42:
    generator: text_canvas
    width: 512
    height: 256
    background: [255, 255, 255]
    text: MLX 42
    text_color: [0, 0, 0]
    font_size: 72
  tone:
    generator: sine_wave
    sample_rate: 16000
    frequency_hz: 440
    duration_seconds: 1.0
scenarios:
  text_completion:
    capability: text_completion
    input:
      interface: completion
      prompt: "The sequence is 1, 2, 3,"
    generation:
      max_tokens: 4
    assertions:
      synthetic:
        - finite_logits
        - output_shape
      real:
        - non_empty
  text_instruction:
    capability: text_instruction
    input:
      interface: chat
      prompt: "Reply with only the number: What is 2 + 2?"
    generation:
      max_tokens: 4
    assertions:
      synthetic:
        - finite_logits
        - output_shape
      real:
        - type: normalized_equals
          value: "4"
  vlm_color:
    capability: vision_language
    input:
      interface: chat
      fixture: red_square
      prompt: "What color is the square? Answer with one lowercase word."
    generation:
      max_tokens: 4
    assertions:
      synthetic:
        - finite_logits
        - output_shape
      real:
        - type: normalized_equals
          value: red
  ocr:
    capability: ocr
    input:
      fixture: mlx_42
      prompt: "Transcribe all visible text exactly."
    generation:
      max_tokens: 8
    assertions:
      synthetic:
        - finite_logits
        - output_shape
      real:
        - type: normalized_contains
          value: MLX 42
  image_generation:
    capability: image_generation
    input:
      prompt: "A solid red square centered on a white background."
    generation:
      width: 64
      height: 64
      steps: 2
    assertions:
      synthetic:
        - finite_pixels
        - output_shape
      real:
        - non_uniform_image
        - red_channel_dominant
  image_editing:
    capability: image_editing
    input:
      fixture: red_square
      prompt: "Change the red square to blue and keep the background white."
    generation:
      width: 64
      height: 64
      steps: 2
    assertions:
      synthetic:
        - finite_pixels
        - output_shape
      real:
        - non_uniform_image
        - blue_channel_dominant
  embedding:
    capability: embedding
    input:
      texts:
        - "a red square"
        - "a red square"
        - "a blue circle"
      fixture: red_square
    assertions:
      synthetic:
        - finite_embeddings
        - output_shape
      real:
        - matching_pair_similarity_above_mismatch
  detection:
    capability: detection
    input:
      fixture: red_square
      prompt: "Locate the red square."
    assertions:
      synthetic:
        - finite_outputs
        - output_schema
      real:
        - coordinates_in_bounds
        - non_empty_detections
  segmentation:
    capability: segmentation
    input:
      fixture: red_square
      prompt: "Segment the red square."
    assertions:
      synthetic:
        - finite_outputs
        - output_shape
      real:
        - valid_mask
        - non_empty_mask
  audio_language:
    capability: audio_language
    input:
      interface: chat
      fixture: tone
      prompt: "Describe this audio briefly."
    generation:
      max_tokens: 8
    assertions:
      synthetic:
        - finite_logits
        - output_shape
      real:
        - non_empty
