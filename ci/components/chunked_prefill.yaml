name: chunked_prefill
enabled: true
description: Chunked prefill in the autoregressive generate path.
paths:
  - mlx_vlm/generate/ar.py
  - mlx_vlm/generate/common.py
columns: [cache_kinds, chunked_prefill, hybrid_cache]
requires: [chunked_prefill]   # only architectures that support it
scenario: long_prompt
regimes: [single]
metrics: [prefill_tps, ttft_ms, peak_mem_gb, output_hash]
configs:
  - {id: "off", args: {prefill_step_size: 0}}
  - {id: chunk-512, args: {prefill_step_size: 512}}
  - {id: chunk-2048, args: {prefill_step_size: 2048}}
