name: apc
enabled: true
description: Automatic prefix caching.

paths:
  - mlx_vlm/apc.py
  - mlx_vlm/apc_adapters.py
  - mlx_vlm/apc_storage.py

# image_in IS in scope here, unlike kv_cache: APC hashes media payloads
# (hash_image_payload, media_token_spans), so modality changes its behaviour.
columns: [cache_kinds, apc_exact, apc_block, image_in]

# Prefix caching does no work on a first request. A single-request cell
# would report zero change regardless of the diff.
scenario: shared_prefix_pair
regimes: [single]

# APCStats.snapshot() exposes real functional counters. These are the
# primary signal: a change that holds throughput flat while token_hit_rate
# collapses is a regression timing cannot see.
metrics: [token_hit_rate, matched_tokens, rejects_by_reason,
          prefill_tps, decode_tps, ttft_ms, peak_mem_gb]

configs:
  - id: "off"
    env: {MLX_VLM_APC_ENABLED: "0"}
  - id: exact
    env: {MLX_VLM_APC_ENABLED: "1", MLX_VLM_APC_EXACT_MIN_TOKENS: "16"}
  - id: block-16
    env: {MLX_VLM_APC_ENABLED: "1", MLX_VLM_APC_BLOCK_SIZE: "16"}
  - id: block-256           # block-boundary arithmetic differs at scale
    env: {MLX_VLM_APC_ENABLED: "1", MLX_VLM_APC_BLOCK_SIZE: "256"}
  - id: guarded
    env: {MLX_VLM_APC_ENABLED: "1", MLX_VLM_APC_EXACT_PREFIX_GUARD_TOKENS: "8"}
