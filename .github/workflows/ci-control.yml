name: CI plan

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: ci-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.MLX_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLX_CI_APP_PRIVATE_KEY }}
          owner: Marvis-Labs
          repositories: mlx-ci
          permission-contents: write
      - name: Dispatch trusted planning request
        env:
          DELIVERY_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$DELIVERY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          jq -n \
            --arg repository "$REPOSITORY" \
            --argjson pull_request "$PR_NUMBER" \
            --argjson delivery_id "$DELIVERY_ID" \
            '{event_type:"ci-plan-request",client_payload:{schema_version:1,repository:$repository,pull_request:$pull_request,delivery_id:$delivery_id}}' \
            > "$RUNNER_TEMP/dispatch.json"
          gh api repos/Marvis-Labs/mlx-ci/dispatches \
            --method POST \
            --input "$RUNNER_TEMP/dispatch.json"
