name: CI control

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: ci-control-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    permissions:
      contents: read
    uses: Marvis-Labs/mlx-ci/.github/workflows/repository-plan.yml@6ed7a602a7426be8918696261e2fc59d8997ba96
