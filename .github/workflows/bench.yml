name: benchmark

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: benchmark-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ci run') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
      has_device: ${{ steps.dispatch.outputs.has_device }}
      runs_on: ${{ steps.dispatch.outputs.runs_on }}
    steps:
      - name: Acknowledge request
        run: gh api -X POST repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -f content=eyes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Resolve immutable revisions
        id: pr
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} \
            --jq '"base=\(.base.sha)\nhead=\(.head.sha)"' >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.pr.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build immutable job plan
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          git fetch --no-tags origin "pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          mkdir -p "$RUNNER_TEMP/pr-ci"
          git show "$HEAD_SHA:ci/model_path.yaml" > "$RUNNER_TEMP/pr-ci/model_path.yaml"
          git show "$HEAD_SHA:ci/model-path-scenario.yaml" > "$RUNNER_TEMP/pr-ci/model-path-scenario.yaml"
          python -m pip install --quiet pyyaml==6.0.3
          python -m ci.control plan \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repository "${{ github.repository }}" \
            --pr "$PR_NUMBER" \
            --rules-config ci/change-rules.yaml \
            --model-config "$RUNNER_TEMP/pr-ci/model_path.yaml" \
            --scenario-config "$RUNNER_TEMP/pr-ci/model-path-scenario.yaml" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output control.json \
            --markdown planning.md
          python -m ci.control release \
            --control control.json \
            --current-head "$HEAD_SHA" \
            --output runner-plan.json \
            --markdown released.md
      - name: Select smallest available device
        id: dispatch
        env:
          CI_DEVICES: ${{ vars.CI_DEVICES }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$CI_DEVICES"
          printf '%s\n' "$CI_DEVICES" > devices.json
          : > busy-runners.txt
          gh api "repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=100" \
            --jq '.workflow_runs[].id' | while read -r run_id; do
              gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
                --jq '.jobs[] | select(.status == "in_progress") | .runner_name'
            done >> busy-runners.txt
          jq -Rsc 'split("\n") | map(select(length > 0))' busy-runners.txt > busy.json
          python -m ci.device_inventory \
            --plan runner-plan.json \
            --devices devices.json \
            --busy busy.json \
            --dispatch dispatch.json \
            --job job.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dispatch-${{ github.run_id }}
          path: |
            control.json
            runner-plan.json
            dispatch.json
            job.json
            devices.json
            busy.json

  execute:
    needs: prepare
    if: needs.prepare.outputs.has_device == 'true'
    runs-on: ${{ fromJSON(needs.prepare.outputs.runs_on) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.head }}
          path: head
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dispatch-${{ github.run_id }}
          path: dispatch
      - name: Compare base and pull request
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          "$HOME/mlx-vlm-ci-runner/RUN_JOB.sh" \
            dispatch/job.json "$RUNNER_TEMP/device-result.json" -- \
            /usr/bin/python3 "$GITHUB_WORKSPACE/control/ci/model_path_compare.py" \
              --job "$GITHUB_WORKSPACE/dispatch/job.json" \
              --base "$GITHUB_WORKSPACE/base" \
              --head "$GITHUB_WORKSPACE/head" \
              --probe "$GITHUB_WORKSPACE/control/ci/model_path_probe.py" \
              --image "$GITHUB_WORKSPACE/control/ci/assets/cat.jpg" \
              --max-tokens 32
          set -e
          /usr/bin/python3 "$GITHUB_WORKSPACE/control/ci/worker_result.py" \
            --job "$GITHUB_WORKSPACE/dispatch/job.json" \
            --result "$RUNNER_TEMP/device-result.json" \
            --output result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: execution-${{ github.run_id }}
          path: result.json

  report:
    needs: [prepare, execute]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dispatch-${{ github.run_id }}
          path: dispatch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.execute.result == 'success'
        with:
          name: execution-${{ github.run_id }}
          path: execution
      - name: Render final bot output
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m ci.workflow_report \
            --plan dispatch/runner-plan.json \
            --dispatch dispatch/dispatch.json \
            --result execution/result.json \
            --run-url "$RUN_URL" \
            --record final-record.json \
            --markdown summary.md
      - name: Update pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_PR: ${{ github.event.issue.number }}
          CI_SUMMARY: summary.md
        run: bash .github/scripts/upsert-mlx-vlm-ci-comment.sh
      - name: Set commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(python -c 'import json; r=json.load(open("final-record.json")); print("success" if r["outcome"] in {"passed", "improved"} else "failure")')
          gh api --method POST repos/${{ github.repository }}/statuses/${{ needs.prepare.outputs.head }} \
            -f state="$state" -f context=mlx-vlm-ci \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-${{ github.run_id }}
          path: |
            final-record.json
            summary.md
