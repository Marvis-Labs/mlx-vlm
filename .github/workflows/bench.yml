name: benchmark

# Label-gated, never on raw pull_request from a fork: a self-hosted runner
# executes whatever the workflow tells it to, on our own hardware.
on:
  pull_request_target:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number"
        required: true

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  route:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: ubuntu-latest          # cloud: cheap, no hardware needed
    outputs:
      cells: ${{ steps.route.outputs.cells }}
      base:  ${{ steps.route.outputs.base }}
      head:  ${{ steps.route.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - id: route
        run: python -m ci.route --base "$BASE" --head "$HEAD" --out "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  cell:
    needs: route
    strategy:
      fail-fast: false
      max-parallel: 4              # one cell per device; devices are single-tenant
      matrix:
        cell: ${{ fromJSON(needs.route.outputs.cells) }}
    # Labels route a cell to hardware that can hold it.
    runs-on: ${{ matrix.cell.runs_on }}
    timeout-minutes: 90
    steps:
      - name: readiness
        run: NEED_GB=${{ matrix.cell.requires_gb }} ci/runner/readiness.sh

      - name: checkout both revisions
        run: ci/runner/prepare.sh "${{ needs.route.outputs.base }}" "${{ needs.route.outputs.head }}"

      - name: warm model cache            # once, shared by both halves
        run: ci/runner/warm.sh '${{ toJSON(matrix.cell) }}'

      - name: measure                     # interleaved A/B/A/B, medians compared
        run: ci/runner/measure.sh '${{ toJSON(matrix.cell) }}'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.cell.id }}
          path: result.json

      - name: release
        if: always()
        run: ci/runner/cleanup.sh

  report:
    needs: [route, cell]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: result-*
          merge-multiple: true
      - run: python -m ci.report --results results --pr "${{ github.event.pull_request.number || inputs.pr }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
