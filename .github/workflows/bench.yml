name: benchmark

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  prepare:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ci run') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
      attempt_acquired: ${{ steps.attempt.outputs.acquired }}
      owner_attempt_id: ${{ steps.attempt.outputs.owner_attempt_id }}
      owner_run_url: ${{ steps.attempt.outputs.owner_run_url }}
      has_work: ${{ steps.dispatch.outputs.has_work || 'false' }}
      matrix: ${{ steps.dispatch.outputs.matrix || '{"include":[]}' }}
    steps:
      - name: Acknowledge request
        run: gh api -X POST repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -f content=eyes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Resolve immutable revisions
        id: pr
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} \
            --jq '"base=\(.base.sha)\nhead=\(.head.sha)"' >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.pr.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build immutable ModelPath work plan
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          git fetch --no-tags origin "pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          mkdir -p "$RUNNER_TEMP/pr-ci"
          git show "$HEAD_SHA:ci/model_path.yaml" > "$RUNNER_TEMP/pr-ci/model_path.yaml"
          git show "$HEAD_SHA:ci/model-path-scenario.yaml" > "$RUNNER_TEMP/pr-ci/model-path-scenario.yaml"
          python -m pip install --quiet pyyaml==6.0.3
          python -m ci.control plan \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repository "${{ github.repository }}" \
            --pr "$PR_NUMBER" \
            --rules-config ci/change-rules.yaml \
            --model-config "$RUNNER_TEMP/pr-ci/model_path.yaml" \
            --scenario-config "$RUNNER_TEMP/pr-ci/model-path-scenario.yaml" \
            --protected-config ci/protected_paths.yaml \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output control.json \
            --markdown planning.md
          python -m ci.control release \
            --control control.json \
            --current-head "$HEAD_SHA" \
            --output runner-plan.json \
            --markdown released.md
      - name: Acquire pull request attempt
        id: attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m ci.attempt_lease acquire \
            --repository "${{ github.repository }}" \
            --attempt-id "${{ github.run_id }}" \
            --pr "${{ github.event.issue.number }}" \
            --head-sha "${{ steps.pr.outputs.head }}" \
            --target-sha "${{ github.workflow_sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --ttl-seconds 7200 \
            --output attempt-lease.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Build active runner inventory
        if: steps.attempt.outputs.acquired == 'true'
        env:
          CI_DEVICES: ${{ vars.CI_DEVICES }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$CI_DEVICES"
          printf '%s\n' "$CI_DEVICES" > devices.json
          jq '{runners: map({name, status: "online", busy: false})}' devices.json > live-runners.json
          : > busy-runners.txt
          gh api "repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=100" \
            --jq '.workflow_runs[].id' | while read -r run_id; do
              gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
                --jq '.jobs[] | select(.status == "in_progress") | .runner_name'
            done >> busy-runners.txt
          jq -Rsc 'split("\n") | map(select(length > 0))' busy-runners.txt > busy.json
      - name: Atomically lease devices for ModelPath work
        id: dispatch
        if: steps.attempt.outputs.acquired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m ci.device_lease acquire-batch \
            --plan runner-plan.json \
            --devices devices.json \
            --busy busy.json \
            --live-runners live-runners.json \
            --repository "${{ github.repository }}" \
            --attempt-id "${{ github.run_id }}" \
            --head-sha "${{ steps.pr.outputs.head }}" \
            --target-sha "${{ github.workflow_sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --ttl-seconds 900 \
            --directory batch \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dispatch-${{ github.run_id }}
          path: |
            control.json
            runner-plan.json
            attempt-lease.json
            batch

  execute:
    needs: prepare
    if: >
      needs.prepare.outputs.attempt_acquired == 'true' &&
      needs.prepare.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.head }}
          path: head
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dispatch-${{ github.run_id }}
          path: dispatch
      - name: Run ordered synthetic and checkpoint phases
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          item="$GITHUB_WORKSPACE/dispatch/batch/${{ matrix.key }}"
          lease_stop="$RUNNER_TEMP/lease-heartbeat-stop"
          GH_TOKEN="${{ github.token }}" PYTHONPATH="$GITHUB_WORKSPACE/control" \
            /usr/bin/python3 -m ci.device_lease heartbeat-loop \
            --lease "$item/lease.json" \
            --repository "${{ github.repository }}" \
            --parent-pid "$PPID" \
            --stop-file "$lease_stop" &
          lease_pid=$!
          finish_lease_heartbeat() {
            touch "$lease_stop"
            wait "$lease_pid" || true
          }
          trap finish_lease_heartbeat EXIT
          set +e
          "$HOME/ci-runner/RUN_JOB.sh" \
            "$item/work.json" "$RUNNER_TEMP/device-result.json" -- \
            /usr/bin/python3 "$GITHUB_WORKSPACE/control/ci/model_path_work.py" \
              --job "$item/work.json" \
              --profiles "$GITHUB_WORKSPACE/control/ci/model_path.yaml" \
              --base "$GITHUB_WORKSPACE/base" \
              --head "$GITHUB_WORKSPACE/head" \
              --synthetic-compare "$GITHUB_WORKSPACE/control/ci/model_path_synthetic_compare.py" \
              --synthetic-probe "$GITHUB_WORKSPACE/control/ci/model_path_synthetic_probe.py" \
              --hf-compare "$GITHUB_WORKSPACE/control/ci/model_path_compare.py" \
              --hf-probe "$GITHUB_WORKSPACE/control/ci/model_path_probe.py" \
              --image "$GITHUB_WORKSPACE/control/ci/assets/cat.jpg" \
              --max-tokens 16
          set -e
          finish_lease_heartbeat
          trap - EXIT
          /usr/bin/python3 "$GITHUB_WORKSPACE/control/ci/worker_result.py" \
            --job "$item/work.json" \
            --result "$RUNNER_TEMP/device-result.json" \
            --output "result-${{ matrix.key }}.json"
      - name: Release device lease
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/control
        run: |
          python -m ci.device_lease release \
            --lease "dispatch/batch/${{ matrix.key }}/lease.json" \
            --repository "${{ github.repository }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: execution-${{ github.run_id }}-wave-1-${{ matrix.key }}
          path: result-${{ matrix.key }}.json

  retry:
    needs: [prepare, execute]
    if: always() && needs.prepare.outputs.attempt_acquired == 'true'
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.dispatch.outputs.has_work || 'false' }}
      matrix: ${{ steps.dispatch.outputs.matrix || '{"include":[]}' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.base || github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dispatch-${{ github.run_id }}
          path: dispatch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: execution-${{ github.run_id }}-wave-1-*
          path: execution
          merge-multiple: true
      - name: Refresh runner inventory
        env:
          CI_DEVICES: ${{ vars.CI_DEVICES }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$CI_DEVICES" > devices.json
          jq '{runners: map({name, status: "online", busy: false})}' devices.json > live-runners.json
          : > busy-runners.txt
          gh api "repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=100" \
            --jq '.workflow_runs[].id' | while read -r run_id; do
              gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
                --jq '.jobs[] | select(.status == "in_progress") | .runner_name'
            done >> busy-runners.txt
          jq -Rsc 'split("\n") | map(select(length > 0))' busy-runners.txt > busy.json
      - name: Escalate declined or missing work
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m ci.device_lease retry-batch \
            --batch dispatch/batch/batch.json \
            --results-directory execution \
            --devices devices.json \
            --busy busy.json \
            --live-runners live-runners.json \
            --repository "${{ github.repository }}" \
            --attempt-id "${{ github.run_id }}" \
            --head-sha "${{ needs.prepare.outputs.head }}" \
            --target-sha "${{ github.workflow_sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --ttl-seconds 900 \
            --directory batch \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retry-dispatch-${{ github.run_id }}
          path: batch

  execute-retry:
    needs: [prepare, retry]
    if: needs.retry.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.retry.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.head }}
          path: head
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: retry-dispatch-${{ github.run_id }}
          path: dispatch
      - name: Run ordered synthetic and checkpoint phases
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          item="$GITHUB_WORKSPACE/dispatch/${{ matrix.key }}"
          lease_stop="$RUNNER_TEMP/lease-heartbeat-stop"
          GH_TOKEN="${{ github.token }}" PYTHONPATH="$GITHUB_WORKSPACE/control" \
            /usr/bin/python3 -m ci.device_lease heartbeat-loop \
            --lease "$item/lease.json" \
            --repository "${{ github.repository }}" \
            --parent-pid "$PPID" \
            --stop-file "$lease_stop" &
          lease_pid=$!
          finish_lease_heartbeat() {
            touch "$lease_stop"
            wait "$lease_pid" || true
          }
          trap finish_lease_heartbeat EXIT
          set +e
          "$HOME/ci-runner/RUN_JOB.sh" \
            "$item/work.json" "$RUNNER_TEMP/device-result.json" -- \
            /usr/bin/python3 "$GITHUB_WORKSPACE/control/ci/model_path_work.py" \
              --job "$item/work.json" \
              --profiles "$GITHUB_WORKSPACE/control/ci/model_path.yaml" \
              --base "$GITHUB_WORKSPACE/base" \
              --head "$GITHUB_WORKSPACE/head" \
              --synthetic-compare "$GITHUB_WORKSPACE/control/ci/model_path_synthetic_compare.py" \
              --synthetic-probe "$GITHUB_WORKSPACE/control/ci/model_path_synthetic_probe.py" \
              --hf-compare "$GITHUB_WORKSPACE/control/ci/model_path_compare.py" \
              --hf-probe "$GITHUB_WORKSPACE/control/ci/model_path_probe.py" \
              --image "$GITHUB_WORKSPACE/control/ci/assets/cat.jpg" \
              --max-tokens 16
          set -e
          finish_lease_heartbeat
          trap - EXIT
          /usr/bin/python3 "$GITHUB_WORKSPACE/control/ci/worker_result.py" \
            --job "$item/work.json" \
            --result "$RUNNER_TEMP/device-result.json" \
            --output "result-${{ matrix.key }}.json"
      - name: Release device lease
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/control
        run: |
          python -m ci.device_lease release \
            --lease "dispatch/${{ matrix.key }}/lease.json" \
            --repository "${{ github.repository }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: execution-${{ github.run_id }}-wave-2-${{ matrix.key }}
          path: result-${{ matrix.key }}.json

  report:
    needs: [prepare, execute, retry, execute-retry]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.base || github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: dispatch-${{ github.run_id }}
          path: dispatch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: retry-dispatch-${{ github.run_id }}
          path: retry-dispatch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: execution-${{ github.run_id }}-wave-1-*
          path: execution/wave-1
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: execution-${{ github.run_id }}-wave-2-*
          path: execution/wave-2
          merge-multiple: true
      - name: Resolve attempt commit
        id: attempt
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_HEAD: ${{ needs.prepare.outputs.head }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          head_sha="$PREPARED_HEAD"
          if [[ -z "$head_sha" ]]; then
            head_sha="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .head.sha)"
          fi
          printf 'head=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
      - name: Render final bot output
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(
            --plan dispatch/runner-plan.json
            --run-url "$RUN_URL"
            --attempt-id "${{ github.run_id }}"
            --head-sha "${{ steps.attempt.outputs.head }}"
            --execution-status "${{ needs.execute.result }}"
            --record final-record.json
            --markdown summary.md
          )
          if [[ "${{ needs.prepare.outputs.attempt_acquired }}" == "false" ]]; then
            args+=(
              --coalesced-owner "${{ needs.prepare.outputs.owner_attempt_id }}"
              --coalesced-url "${{ needs.prepare.outputs.owner_run_url }}"
            )
          else
            batch=dispatch/batch/batch.json
            [[ ! -f retry-dispatch/batch.json ]] || batch=retry-dispatch/batch.json
            args+=(--batch "$batch" --results-directory execution)
          fi
          python -m ci.workflow_report "${args[@]}"
      - name: Post immutable attempt result
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_PR: ${{ github.event.issue.number }}
          CI_SUMMARY: summary.md
          CI_ATTEMPT_ID: ${{ github.run_id }}
        run: bash .github/scripts/post-ci-attempt.sh
      - name: Set commit status
        if: needs.prepare.outputs.attempt_acquired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(python -c 'import json; r=json.load(open("final-record.json")); print("success" if r["outcome"] in {"passed", "improved"} else "failure")')
          sha=$(python -c 'import json; print(json.load(open("final-record.json"))["head_sha"])')
          gh api --method POST repos/${{ github.repository }}/statuses/$sha \
            -f state="$state" -f context=mlx-vlm/apple-silicon \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Release remaining leases
        if: always() && needs.prepare.outputs.attempt_acquired == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m ci.device_lease release-batch \
            --batch dispatch/batch/batch.json \
            --repository "${{ github.repository }}"
          if [[ -f retry-dispatch/batch.json ]]; then
            python -m ci.device_lease release-batch \
              --batch retry-dispatch/batch.json \
              --repository "${{ github.repository }}"
          fi
          python -m ci.attempt_lease release \
            --lease dispatch/attempt-lease.json \
            --repository "${{ github.repository }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-${{ github.run_id }}
          path: |
            final-record.json
            summary.md
      - name: Enforce terminal result
        if: always()
        run: |
          python - <<'PY'
          import json

          outcome = json.load(open("final-record.json"))["outcome"]
          raise SystemExit(0 if outcome in {"passed", "improved", "coalesced"} else 1)
          PY
