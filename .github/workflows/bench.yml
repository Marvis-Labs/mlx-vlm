name: benchmark

# Runners are registered to this repository, which we own; upstream pull
# requests are fetched by number rather than requiring anything from the
# upstream maintainer. Manual dispatch only: a self-hosted runner executes
# whatever the pull request contains, on our own hardware.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Blaizzy/mlx-vlm PR number"
        required: true
      upstream:
        description: "source repository"
        default: Blaizzy/mlx-vlm

permissions:
  contents: read

concurrency:
  group: bench-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.r.outputs.cells }}
      head: ${{ steps.r.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: resolve the pull request
        id: pr
        run: |
          gh api repos/${{ inputs.upstream }}/pulls/${{ inputs.pr }} \
            --jq '"head=\(.head.sha)\nbase=\(.base.sha)"' >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: select cells
        id: r
        run: |
          git remote add up https://github.com/${{ inputs.upstream }}.git
          git fetch -q up "+refs/pull/${{ inputs.pr }}/head:refs/remotes/pr/head" "+refs/heads/main:refs/remotes/up/main"
          BASE=$(git merge-base up/main pr/head)
          echo "head=$(git rev-parse pr/head)" >> "$GITHUB_OUTPUT"
          python -m ci.route --base "$BASE" --head "$(git rev-parse pr/head)" \
            --gh-repo ${{ github.repository }} --out "$GITHUB_OUTPUT"

  cell:
    needs: route
    if: needs.route.outputs.cells != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4          # one cell per device; devices are single tenant
      matrix:
        cell: ${{ fromJSON(needs.route.outputs.cells) }}
    runs-on: ${{ matrix.cell.runs_on }}
    timeout-minutes: 90
    steps:
      # No checkout: the device fetches both refs itself and resolves the
      # merge-base, so the harness is never shadowed by the revision under
      # test and the job carries no repository state of its own.
      - name: measure
        run: |
          echo '${{ toJSON(matrix.cell) }}' > "$RUNNER_TEMP/cell.json"
          CI_SRC_REPO=https://github.com/${{ inputs.upstream }}.git \
          CI_RESULT="$RUNNER_TEMP/result.json" \
            ~/device-script/bin/device.sh run "$RUNNER_TEMP/cell.json" "${{ needs.route.outputs.head }}"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.cell.id }}
          path: ${{ runner.temp }}/result.json

  report:
    needs: [route, cell]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: result-*
          merge-multiple: true
      - run: python -m ci.report --results results --pr ${{ inputs.pr }} --upstream ${{ inputs.upstream }}
