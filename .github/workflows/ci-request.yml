name: Apple-silicon CI request

on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [ci-run-coalesced]

permissions: {}

jobs:
  dispatch:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/ci run' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.MLX_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLX_CI_APP_PRIVATE_KEY }}
          owner: Marvis-Labs
          repositories: mlx-ci
          permission-contents: write
      - name: Request CI
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          gh api repos/Marvis-Labs/mlx-ci/dispatches
          --method POST
          -f event_type=ci-run-request
          -F 'client_payload[schema_version]=1'
          -f 'client_payload[engine]=vlm'
          -f "client_payload[repository]=$REPOSITORY"
          -F "client_payload[pull_request]=$PR_NUMBER"
          -F "client_payload[comment_id]=$COMMENT_ID"

  coalesced:
    name: Mixie queued request
    if: github.event.action == 'ci-run-coalesced'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: comment-token
        with:
          client-id: ${{ vars.MLX_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLX_CI_APP_PRIVATE_KEY }}
          owner: Marvis-Labs
          repositories: mlx-vlm
          permission-pull-requests: write
      - name: Validate and render coalesced request
        id: comment
        run: >-
          python -m ci.output coalesced
          --event "$GITHUB_EVENT_PATH"
          --request "$RUNNER_TEMP/comment.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Post Mixie comment
        env:
          GH_TOKEN: ${{ steps.comment-token.outputs.token }}
          PR_NUMBER: ${{ steps.comment.outputs.pull_request }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          --method POST
          --input "$RUNNER_TEMP/comment.json"
