name: Apple-silicon CI request

on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [ci-run-result, ci-run-coalesced]

permissions: {}

jobs:
  dispatch:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/ci run' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.MLX_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLX_CI_APP_PRIVATE_KEY }}
          owner: Marvis-Labs
          repositories: mlx-ci
          permission-contents: write
      - name: Request CI
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -n \
            --arg repository "$REPOSITORY" \
            --argjson pull_request "$PR_NUMBER" \
            --argjson comment_id "$COMMENT_ID" \
            '{event_type:"ci-run-request",client_payload:{schema_version:1,engine:"vlm",repository:$repository,pull_request:$pull_request,comment_id:$comment_id}}' \
            > "$RUNNER_TEMP/request.json"
          gh api repos/Marvis-Labs/mlx-ci/dispatches \
            --method POST --input "$RUNNER_TEMP/request.json"

  report:
    name: Mixie
    if: github.event.action == 'ci-run-result'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate result notification
        id: dispatch
        run: >-
          python -m ci.output dispatch
          --event "$GITHUB_EVENT_PATH"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: artifacts
        with:
          client-id: ${{ vars.MLX_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLX_CI_APP_PRIVATE_KEY }}
          owner: Marvis-Labs
          repositories: mlx-ci
          permission-actions: read
          permission-contents: read
      - name: Download validated CI results
        env:
          GH_TOKEN: ${{ steps.artifacts.outputs.token }}
          RUN_ATTEMPT: ${{ steps.dispatch.outputs.run_attempt }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: >-
          gh run download "$RUN_ID"
          --repo Marvis-Labs/mlx-ci
          --name "ci-results-$RUN_ID-$RUN_ATTEMPT"
          --dir "$RUNNER_TEMP/results"
      - name: Render Mixie comment
        id: comment
        env:
          RUN_ATTEMPT: ${{ steps.dispatch.outputs.run_attempt }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: >-
          python -m ci.output comment
          --bundle "$RUNNER_TEMP/results/bundle.json"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$RUN_ID"
          --run-attempt "$RUN_ATTEMPT"
          --output "$RUNNER_TEMP/comment.md"
          --request "$RUNNER_TEMP/comment.json"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: comment-token
        with:
          client-id: ${{ vars.MLX_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLX_CI_APP_PRIVATE_KEY }}
          owner: Marvis-Labs
          repositories: mlx-vlm
          permission-issues: write
      - name: Post Mixie comment
        env:
          GH_TOKEN: ${{ steps.comment-token.outputs.token }}
          PR_NUMBER: ${{ steps.comment.outputs.pull_request }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          --method POST
          --input "$RUNNER_TEMP/comment.json"

  coalesced:
    name: Mixie queued request
    if: github.event.action == 'ci-run-coalesced'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: comment-token
        with:
          client-id: ${{ vars.MLX_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MLX_CI_APP_PRIVATE_KEY }}
          owner: Marvis-Labs
          repositories: mlx-vlm
          permission-issues: write
      - name: Validate and render coalesced request
        id: comment
        run: >-
          python -m ci.output coalesced
          --event "$GITHUB_EVENT_PATH"
          --request "$RUNNER_TEMP/comment.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Post Mixie comment
        env:
          GH_TOKEN: ${{ steps.comment-token.outputs.token }}
          PR_NUMBER: ${{ steps.comment.outputs.pull_request }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          --method POST
          --input "$RUNNER_TEMP/comment.json"
