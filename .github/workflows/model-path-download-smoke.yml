name: Model path download smoke

on:
  pull_request:
    branches: [draft/ci-support-foundation]
    paths:
      - mlx_vlm/models/**

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: model-path-download-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: >-
      github.actor == 'Lazarus-931' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      checkpoint_repo: ${{ steps.select.outputs.checkpoint_repo }}
      checkpoint_revision: ${{ steps.select.outputs.checkpoint_revision }}
      runner_label: ${{ steps.select.outputs.runner_label }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.3
      - name: Plan model-path jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m ci.control plan \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repository "${{ github.repository }}" \
            --pr "$PR_NUMBER" \
            --rules-config ci/change-rules.yaml \
            --model-config ci/model_path.yaml \
            --scenario-config ci/model-path-scenario.yaml \
            --run-url "$RUN_URL" \
            --output control.json \
            --markdown summary.md
      - name: Publish awaiting-command status
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_PR: ${{ github.event.pull_request.number }}
          CI_SUMMARY: summary.md
        run: bash .github/scripts/upsert-mlx-vlm-ci-comment.sh
      - name: Wait for maintainer command
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PR: ${{ github.event.pull_request.number }}
        run: |
          for _ in {1..120}; do
            author="$(gh api "repos/${{ github.repository }}/issues/$CI_PR/comments" --jq '[.[] | select(.body == "/ci run")][-1].user.login // empty')"
            if [[ -n "$author" ]]; then
              permission="$(gh api "repos/${{ github.repository }}/collaborators/$author/permission" --jq .permission)"
              case "$permission" in
                write|maintain|admin) exit 0 ;;
              esac
            fi
            sleep 5
          done
          exit 1
      - name: Release and select smallest device
        id: select
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m ci.control release \
            --control control.json \
            --current-head "$HEAD_SHA" \
            --output runner-plan.json \
            --markdown released-summary.md
          python - <<'PY'
          import json
          import os
          from ci.runner_selection import Device, select_device

          plan = json.load(open("runner-plan.json"))
          job = next(item for item in plan["jobs"] if item["mode"] == "hf_checkpoint")
          devices = [
              Device("m5", "device-alazers-m5-max-128gb", 128),
              Device("lexie", "device-lexie-m4-16gb", 16),
              Device("amelia", "device-amelia-m4-16gb", 16),
          ]
          selected = select_device(job, devices)
          checkpoint = job["hf_checkpoint"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"checkpoint_repo={checkpoint['repo']}\n")
              output.write(f"checkpoint_revision={checkpoint['revision']}\n")
              output.write(f"runner_label={selected.label}\n")
          PY
      - name: Publish released status
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_PR: ${{ github.event.pull_request.number }}
          CI_SUMMARY: released-summary.md
        run: bash .github/scripts/upsert-mlx-vlm-ci-comment.sh

  start-download:
    needs: plan
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - ${{ needs.plan.outputs.runner_label }}
    timeout-minutes: 20
    steps:
      - name: Start revision-pinned checkpoint download
        env:
          CHECKPOINT_REPO: ${{ needs.plan.outputs.checkpoint_repo }}
          CHECKPOINT_REVISION: ${{ needs.plan.outputs.checkpoint_revision }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HF_HUB_DISABLE_XET: "1"
        run: |
          hf_cache="$RUNNER_TEMP/hf-download-smoke"
          uvx --from huggingface_hub==1.27.0 hf download \
            "$CHECKPOINT_REPO" \
            --revision "$CHECKPOINT_REVISION" \
            --include model.safetensors \
            --cache-dir "$hf_cache" \
            --max-workers 1 &
          download_pid=$!
          trap 'kill "$download_pid" 2>/dev/null || true' EXIT
          for _ in {1..240}; do
            downloaded_kib="$(du -sk "$hf_cache" 2>/dev/null | awk '{print $1}')"
            if [[ "${downloaded_kib:-0}" -gt 1024 ]]; then
              gh pr comment "$PR_NUMBER" \
                --repo "${{ github.repository }}" \
                --body "HF_DOWNLOAD_STARTED runner=${{ runner.name }} repo=$CHECKPOINT_REPO revision=$CHECKPOINT_REVISION"
              wait "$download_pid"
              exit $?
            fi
            if ! kill -0 "$download_pid" 2>/dev/null; then
              wait "$download_pid"
              exit $?
            fi
            sleep 1
          done
          exit 1
